<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Веселе Годування для Малюка</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #121222; color: #fff; }

        /* ЕКРАН 1: Фізична сітка */
        #canvas-container { position: absolute; width: 100%; height: 100%; z-index: 5; background: #0b0b13; }
        canvas { width: 100%; height: 100%; display: block; }
        .hint { position: absolute; top: 8%; left: 50%; transform: translateX(-50%); font-size: 26px; color: #ff5e97; text-shadow: 0 0 10px rgba(255, 94, 151, 0.5); pointer-events: none; text-align: center; font-weight: bold; width: 90%; }

        /* ЕКРАН 2: Головна гра */
        #game-screen {
            position: absolute; width: 100%; height: 100%; z-index: 1;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            background: radial-gradient(circle, #1f242d 0%, #121222 100%);
            padding: 20px; opacity: 0; transition: opacity 0.8s ease;
        }
        #game-screen.active { opacity: 1; z-index: 4; }

        /* Тваринка по центру */
        .character-zone {
            flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; position: relative;
        }
        #animal { 
            font-size: 110px; 
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            cursor: pointer; display: inline-block; 
        }
        #animal.eating { transform: scale(1.4) rotate(5deg); }
        #animal.wrong { animation: shake 0.4s ease; }

        /* Зона ротика для попадання */
        .target-mouth {
            position: absolute; width: 140px; height: 140px; top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 50%;
        }

        /* Нижня панель з їжею */
        .food-bar {
            width: 100%; max-width: 600px; display: flex; justify-content: space-around; align-items: center; background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 25px; border: 3px dashed #5ce1e6; margin-bottom: 20px; min-height: 110px; flex-wrap: wrap; gap: 10px;
        }

        /* Елементи їжі */
        .food-item {
            font-size: 55px; cursor: grab; touch-action: none; display: inline-block; transition: transform 0.1s; z-index: 10;
        }
        .food-item:active { cursor: grabbing; transform: scale(1.2); }

        /* Кнопки дій */
        .game-btn {
            display: none; border: none; padding: 18px 45px; font-size: 24px; font-weight: bold; border-radius: 50px; cursor: pointer; margin-bottom: 30px; animation: pulse 1.5s infinite; z-index: 20;
        }
        #next-btn { background: #4caf50; color: white; box-shadow: 0 0 15px rgba(76,175,80,0.4); }
        #finish-btn { background: #ff5e97; color: white; box-shadow: 0 0 15px rgba(255,94,151,0.4); }
        #restart-btn { background: #00adb5; color: white; box-shadow: 0 0 15px rgba(0,173,181,0.4); }

        #win-text { font-size: 28px; margin-top: 15px; color: #66fcf1; font-weight: bold; text-shadow: 0 0 10px rgba(102,252,241,0.5); text-align: center; display: none; }

        /* ЕКРАН 3: ІМЕРСИВНИЙ ЕМБІЄНТ (М'ЯКИЙ ПІСОЧНИЙ ГОДИННИК) */
        #ambient-screen {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0;
            z-index: -1; opacity: 0; background: #090911;
            transition: opacity 2.5s ease-in-out; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }
        #ambient-screen.active { z-index: 100; opacity: 1; }
        #ambient-canvas { position: absolute; width: 100%; height: 100%; top: 0; left: 0; }
        .ambient-title {
            position: absolute; top: 15%; font-size: 30px; font-weight: bold;
            color: #b0e2f5; text-shadow: 0 0 10px rgba(176,226,245,0.4);
            text-align: center; width: 80%; pointer-events: none; z-index: 101;
            font-family: sans-serif;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-12px) rotate(-4deg); }
            75% { transform: translateX(12px) rotate(4deg); }
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.04); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <div class="hint">Пальчиком рви сітку! 🦖🐱✨</div>
        <canvas id="clothCanvas"></canvas>
    </div>

    <div id="game-screen">
        <div class="character-zone">
            <div id="animal">🦖</div>
            <div class="target-mouth" id="mouthTarget"></div>
            <div id="win-text">ТИ НАЙКРАЩИЙ! 🏆</div>
        </div>

        <button id="next-btn" class="game-btn" onclick="goToNextLevel()">ДАЛІ ➡️</button>
        <button id="finish-btn" class="game-btn" onclick="finalCelebration()">ЗАВЕРШИТИ ГРУ 🏁</button>
        <button id="restart-btn" class="game-btn" onclick="resetGame()">ГРАТИ ЗНОВУ 🔄</button>

        <div class="food-bar" id="foodContainer"></div>
    </div>

    <!-- Комфортний екран відпочинку -->
    <div id="ambient-screen">
        <div class="ambient-title">Оченята відпочивають... 🌊✨</div>
        <canvas id="ambient-canvas"></canvas>
    </div>

    <script>
        // --- НАЛАШТУВАННЯ ТАЙМЕРІВ (РЕЛОУД ДЛЯ РЕЛІЗУ) ---
        const TEST_MODE = false; // Змініть на true, якщо захочете знову швидко протестувати за 10 секунд
        const GAME_PLAY_TIME = TEST_MODE ? 10000 : 5 * 60 * 1000; // 5 хвилин безперервної гри
        const RELAX_TIME = TEST_MODE ? 15000 : 60000; // 1 хвилина заспокійливої паузи
        
        let gameTimer = null;
        let ambientAnimationId = null;
        let ambientAudioNodes = []; 

        // --- СИНТЕЗАТОР ЗВУКІВ ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTone(freq, type, duration) {
            try {
                let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        const soundSlice = () => playTone(550, 'sine', 0.04);
        const soundDrag = () => playTone(280, 'triangle', 0.06);
        const soundYum = () => { playTone(400, 'sine', 0.08); setTimeout(() => playTone(550, 'sine', 0.12), 70); };
        const soundWrong = () => playTone(200, 'sine', 0.2); 
        const soundWin = () => { playTone(523, 'sine', 0.15); setTimeout(() => playTone(659, 'sine', 0.15), 120); setTimeout(() => playTone(784, 'sine', 0.3), 240); };
        const soundLevelUp = () => { playTone(587, 'sine', 0.1); setTimeout(() => playTone(698, 'sine', 0.1), 100); setTimeout(() => playTone(880, 'sine', 0.2), 200); };

        // Глибокий заспокійливий звук хвиль (Низькі чисті частоти)
        function startAmbientSound() {
            try {
                ambientAudioNodes = [];
                const frequencies = [110, 146, 220, 293]; // М'яка гармонія Ре-минор / Ля-минор
                
                frequencies.forEach(freq => {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    let lfo = audioCtx.createOscillator();
                    let lfoGain = audioCtx.createGain();

                    osc.type = 'sine'; // Тільки чиста синусоїда без гострих кутів
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                    lfo.type = 'sine';
                    lfo.frequency.setValueAtTime(0.15, audioCtx.currentTime); // Дуже повільне плавання гучності
                    lfoGain.gain.setValueAtTime(0.03, audioCtx.currentTime);

                    gain.gain.setValueAtTime(0.02, audioCtx.currentTime);

                    lfo.connect(lfoGain);
                    lfoGain.connect(gain.gain);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start();
                    lfo.start();

                    ambientAudioNodes.push({ osc, lfo, gain });
                });
            } catch(e){}
        }

        function stopAmbientSound() {
            ambientAudioNodes.forEach(node => {
                try {
                    node.gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 2.0); // Дуже плавно тушимо звук
                    setTimeout(() => {
                        node.osc.stop();
                        node.lfo.stop();
                    }, 2000);
                } catch(e){}
            });
            ambientAudioNodes = [];
        }

        // --- ВСІ 10 РІВНІВ ТВАРИНОК ---
        const levels = [
            { character: "🦖", happyEmoji: "😋", wrongEmoji: "🙅‍♂️", items: [{ emoji: "🌿", edible: true }, { emoji: "🥩", edible: true }, { emoji: "🍎", edible: true }, { emoji: "🍌", edible: true }, { emoji: "👟", edible: false }] },
            { character: "🐱", happyEmoji: "😻", wrongEmoji: "🙀", items: [{ emoji: "🐟", edible: true }, { emoji: "🥛", edible: true }, { emoji: "🐭", edible: true }, { emoji: "🥩", edible: true }, { emoji: "🎈", edible: false }] },
            { character: "🐶", happyEmoji: "🐕", wrongEmoji: "😾", items: [{ emoji: "🍖", edible: true }, { emoji: "🥩", edible: true }, { emoji: "🧀", edible: true }, { emoji: "🦴", edible: true }, { emoji: "🧦", edible: false }] },
            { character: "🐵", happyEmoji: "🐒", wrongEmoji: "🙈", items: [{ emoji: "🍌", edible: true }, { emoji: "🍍", edible: true }, { emoji: "🥥", edible: true }, { emoji: "🍎", edible: true }, { emoji: "🔋", edible: false }] },
            { character: "🐭", happyEmoji: "🐹", wrongEmoji: "🐁", items: [{ emoji: "🧀", edible: true }, { emoji: "🌾", edible: true }, { emoji: "🥜", edible: true }, { emoji: "🌽", edible: true }, { emoji: "🧱", edible: false }] },
            { character: "🐸", happyEmoji: "🐸", wrongEmoji: "😝", items: [{ emoji: "🪰", edible: true }, { emoji: "🦟", edible: true }, { emoji: "🐛", edible: true }, { emoji: "🪲", edible: true }, { emoji: "🪙", edible: false }] },
            { character: "🐝", happyEmoji: "🌻", wrongEmoji: "🥴", items: [{ emoji: "🌸", edible: true }, { emoji: "🌹", edible: true }, { emoji: "🌷", edible: true }, { emoji: "🍯", edible: true }, { emoji: "🧼", edible: false }] },
            { character: "🐰", happyEmoji: "🐇", wrongEmoji: "🐇", items: [{ emoji: "🥕", edible: true }, { emoji: "🥬", edible: true }, { emoji: "🍏", edible: true }, { emoji: "🍓", edible: true }, { emoji: "🔑", edible: false }] },
            { character: "🐻", happyEmoji: "🐻", wrongEmoji: "🐻", items: [{ emoji: "🍯", edible: true }, { emoji: "🐟", edible: true }, { emoji: "🍒", edible: true }, { emoji: "🍇", edible: true }, { emoji: "🪓", edible: false }] },
            { character: "🐷", happyEmoji: "🐖", wrongEmoji: "🐽", items: [{ emoji: "🍎", edible: true }, { emoji: "🌽", edible: true }, { emoji: "🍉", edible: true }, { emoji: "🥔", edible: true }, { emoji: "👟", edible: false }] }
        ];
        
        let currentLevel = 0;
        let currentScale = 1.0;

        // --- ФІЗИКА СІТКИ ---
        const canvas = document.getElementById('clothCanvas'); const ctx = canvas.getContext('2d');
        let points = [], links = [], mouse = { x:0, y:0, px:0, py:0, down:false }, cutCount = 0, passed = false;
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        
        class Point {
            constructor(x, y) { this.x = x; this.y = y; this.oldx = x; this.oldy = y; this.pinned = false; }
            update() { if (this.pinned) return; let vx = (this.x - this.oldx) * 0.98, vy = (this.y - this.oldy) * 0.98; this.oldx = this.x; this.oldy = this.y; this.x += vx; this.y += vy + 0.15; }
        }
        class Link {
            constructor(p1, p2, len) { this.p1 = p1; this.p2 = p2; this.length = len; this.broken = false; }
            resolve() { if (this.broken) return; let dx = this.p2.x - this.p1.x, dy = this.p2.y - this.p1.y, dist = Math.sqrt(dx*dx + dy*dy), diff = this.length - dist, percent = (diff / dist) * 0.5; if (!this.p1.pinned) { this.p1.x -= dx * percent; this.p1.y -= dy * percent; } if (!this.p2.pinned) { this.p2.x += dx * percent; this.p2.y += dy * percent; } }
        }
        
        function initPhysics() {
            resizeCanvas(); points = []; links = []; cutCount = 0; passed = false;
            const spacing = 30; const cols = Math.floor(canvas.width / spacing) - 2, rows = 14; const startX = (canvas.width - cols * spacing) / 2, startY = 80;
            for (let y = 0; y <= rows; y++) { for (let x = 0; x <= cols; x++) { let p = new Point(startX + x * spacing, startY + y * spacing); if (y === 0) p.pinned = true; points.push(p); } }
            for (let y = 0; y <= rows; y++) { for (let x = 0; x <= cols; x++) { if (x < cols) links.push(new Link(points[y * (cols + 1) + x], points[y * (cols + 1) + x + 1], spacing)); if (y < rows) links.push(new Link(points[y * (cols + 1) + x], points[(y + 1) * (cols + 1) + x], spacing)); } }
            animate();
        }
        
        function checkIntersection(p1, p2, p3, p4) { let det = (p2.x - p1.x) * (p4.y - p3.y) - (p4.x - p3.x) * (p2.y - p1.y); if (det === 0) return false; let lambda = ((p4.y - p3.y) * (p4.x - p1.x) + (p3.x - p4.x) * (p4.y - p1.y)) / det, gamma = ((p1.y - p2.y) * (p4.x - p1.x) + (p2.x - p1.x) * (p4.y - p1.y)) / det; return (0 < lambda && lambda < 1) && (0 < gamma && gamma < 1); }
        
        function animate() {
            if (passed) return; ctx.clearRect(0, 0, canvas.width, canvas.height); points.forEach(p => p.update()); let slashed = false;
            for (let i = 0; i < 5; i++) { links.forEach(l => { if (!l.broken) { l.resolve(); if (mouse.down && checkIntersection(l.p1, l.p2, {x: mouse.px, y: mouse.py}, {x: mouse.x, y: mouse.y})) { l.broken = true; cutCount++; slashed = true; } } }); }
            if (slashed) soundSlice();
            ctx.beginPath(); ctx.strokeStyle = '#ff5e97'; ctx.lineWidth = 3; links.forEach(l => { if (!l.broken) { ctx.moveTo(l.p1.x, l.p1.y); ctx.lineTo(l.p2.x, l.p2.y); } }); ctx.stroke();
            mouse.px = mouse.x; mouse.py = mouse.y;
            if (cutCount > 50) { passed = true; setTimeout(showGame, 300); } else { requestAnimationFrame(animate); }
        }
        
        function handleMove(e) { let clientX = e.touches ? e.touches[0].clientX : e.clientX, clientY = e.touches ? e.touches[0].clientY : e.clientY; mouse.x = clientX; mouse.y = clientY; }
        window.addEventListener('mousedown', (e) => { audioCtx.resume(); mouse.down = true; handleMove(e); mouse.px = mouse.x; mouse.py = mouse.y; });
        window.addEventListener('mousemove', handleMove); window.addEventListener('mouseup', () => mouse.down = false);
        window.addEventListener('touchstart', (e) => { audioCtx.resume(); mouse.down = true; handleMove(e); mouse.px = mouse.x; mouse.py = mouse.y; });
        window.addEventListener('touchmove', handleMove); window.addEventListener('touchend', () => mouse.down = false);
        
        initPhysics();

        function showGame() {
            document.getElementById('canvas-container').style.display = 'none';
            document.getElementById('game-screen').classList.add('active');
            loadLevel();
            startGameplayTimer(); 
        }

        // --- КЕРУВАННЯ ТАЙМЕРАМИ ГРИ ---
        function startGameplayTimer() {
            clearTimeout(gameTimer);
            gameTimer = setTimeout(triggerAmbientRelax, GAME_PLAY_TIME);
        }

        // --- АКТИВАЦІЯ М'ЯКОГО РЕЛАКСУ ---
        function triggerAmbientRelax() {
            const ambScreen = document.getElementById('ambient-screen');
            ambScreen.classList.add('active');
            
            startAmbientSound();
            initAmbientSandSimulation();

            setTimeout(() => {
                stopAmbientSound();
                cancelAnimationFrame(ambientAnimationId);
                ambScreen.classList.remove('active');
                startGameplayTimer(); 
            }, RELAX_TIME);
        }

        // Плавна пастельна анімація (М'який пісок без мерехтіння)
        function initAmbientSandSimulation() {
            const ambCanvas = document.getElementById('ambient-canvas');
            const ambCtx = ambCanvas.getContext('2d');
            
            ambCanvas.width = window.innerWidth;
            ambCanvas.height = window.innerHeight;

            let grains = [];
            // Пастельні, приємні для очей малюка кольори (блакитний, лавандовий, рожевий, м'ята)
            const colors = ['#7cd1e0', '#a78bfa', '#f472b6', '#34d399', '#60a5fa'];
            let floorY = ambCanvas.height;

            function drawSand() {
                // Чистий колір тла з мінімальним нашаруванням для плавного ходу піщинок
                ambCtx.fillStyle = 'rgba(9, 9, 17, 0.12)';
                ambCtx.fillRect(0, 0, ambCanvas.width, ambCanvas.height);

                if (floorY > ambCanvas.height * 0.25) {
                    floorY -= 0.18; // Плавне підняття нижнього рівня
                }

                // Генеруємо піщинки з невеликою інтенсивністю, щоб не рябіло в очах
                if (grains.length < 350) {
                    for(let i = 0; i < 2; i++) {
                        grains.push({
                            x: ambCanvas.width / 2 + (Math.random() * 20 - 10),
                            y: 0,
                            vx: Math.random() * 1.2 - 0.6,
                            vy: 2.2 + Math.random() * 2.5, // Повільне, спокійне падіння
                            radius: 4 + Math.random() * 4,
                            color: colors[Math.floor(Math.random() * colors.length)]
                        });
                    }
                }

                for (let i = grains.length - 1; i >= 0; i--) {
                    let g = grains[i];
                    g.y += g.vy;
                    g.x += g.vx;

                    ambCtx.beginPath();
                    ambCtx.arc(g.x, g.y, g.radius, 0, Math.PI * 2);
                    ambCtx.fillStyle = g.color;
                    ambCtx.shadowBlur = 0; // ПОВНІСТЮ прибрано важкі миготливі тіні
                    ambCtx.fill();

                    if (g.y >= floorY - g.radius) {
                        grains.splice(i, 1);
                    }
                }

                // Малюємо спокійну основу
                ambCtx.fillStyle = '#16162a';
                ambCtx.fillRect(0, floorY, ambCanvas.width, ambCanvas.height - floorY);

                // Ніжний градієнт поверх дна (Ефект підводного свічення)
                let grad = ambCtx.createLinearGradient(0, floorY, 0, ambCanvas.height);
                grad.addColorStop(0, '#a78bfa');
                grad.addColorStop(0.6, '#7cd1e0');
                grad.addColorStop(1, '#090911');
                ambCtx.fillStyle = grad;
                ambCtx.globalAlpha = 0.25; // Дуже прозоро і м'яко
                ambCtx.fillRect(0, floorY, ambCanvas.width, ambCanvas.height - floorY);
                ambCtx.globalAlpha = 1.0;

                ambientAnimationId = requestAnimationFrame(drawSand);
            }
            drawSand();
        }

        // --- КЕРУВАННЯ ГОДУВАННЯМ ---
        function loadLevel() {
            const lvl = levels[currentLevel];
            const animalDiv = document.getElementById('animal');
            const container = document.getElementById('foodContainer');
            
            document.getElementById('next-btn').style.display = 'none';

            currentScale = 1.0;
            animalDiv.innerText = lvl.character;
            animalDiv.style.transform = `scale(${currentScale})`;
            container.style.display = 'flex';
            container.innerHTML = '';

            lvl.items.forEach((item, index) => {
                const foodHtml = `<div class="food-item" id="food-${index}" data-edible="${item.edible}">${item.emoji}</div>`;
                container.insertAdjacentHTML('beforeend', foodHtml);
            });

            initDragAndDrop();
        }

        function initDragAndDrop() {
            const foodItems = document.querySelectorAll('.food-item');
            const animalDiv = document.getElementById('animal');
            const mouthTarget = document.getElementById('mouthTarget');
            const lvl = levels[currentLevel];

            foodItems.forEach(item => {
                let startX = 0, startY = 0, currentX = 0, currentY = 0;
                const isEdible = item.getAttribute('data-edible') === 'true';

                item.addEventListener('touchstart', dragStart);
                item.addEventListener('mousedown', dragStart);

                function dragStart(e) {
                    soundDrag();
                    let clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    let clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    startX = clientX - currentX; startY = clientY - currentY;
                    document.addEventListener('touchmove', dragMove, { passive: false });
                    document.addEventListener('mousemove', dragMove);
                    document.addEventListener('touchend', dragEnd);
                    document.addEventListener('mouseup', dragEnd);
                }

                function dragMove(e) {
                    e.preventDefault();
                    let clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    let clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    currentX = clientX - startX; currentY = clientY - startY;
                    item.style.transform = `translate(${currentX}px, ${currentY}px) scale(1.15)`;
                }

                function dragEnd() {
                    document.removeEventListener('touchmove', dragMove);
                    document.removeEventListener('mousemove', dragMove);
                    document.removeEventListener('touchend', dragEnd);
                    document.removeEventListener('mouseup', dragEnd);

                    const itemRect = item.getBoundingClientRect();
                    const mouthRect = mouthTarget.getBoundingClientRect();
                    const isOverMouth = !(itemRect.right < mouthRect.left || itemRect.left > mouthRect.right || 
                                          itemRect.bottom < mouthRect.top || itemRect.top > mouthRect.bottom);

                    if (isOverMouth) {
                        if (isEdible) {
                            soundYum();
                            animalDiv.innerText = lvl.happyEmoji;
                            animalDiv.classList.add('eating');
                            item.style.display = 'none';
                            currentScale += 0.15;

                            setTimeout(() => {
                                animalDiv.innerText = lvl.character;
                                animalDiv.classList.remove('eating');
                                animalDiv.style.transform = `scale(${currentScale})`;
                                checkLevelProgress();
                            }, 700);
                        } else {
                            soundWrong();
                            animalDiv.innerText = lvl.wrongEmoji;
                            animalDiv.classList.add('wrong');
                            currentX = 0; currentY = 0;
                            item.style.transform = `translate(0px, 0px)`;
                            setTimeout(() => { animalDiv.innerText = lvl.character; animalDiv.classList.remove('wrong'); }, 800);
                        }
                    } else {
                        currentX = 0; currentY = 0; item.style.transform = `translate(0px, 0px)`;
                    }
                }
            });
        }

        function checkLevelProgress() {
            const remainingEdible = Array.from(document.querySelectorAll('.food-item')).filter(i => i.style.display !== 'none' && i.getAttribute('data-edible') === 'true');
            
            if (remainingEdible.length === 0) {
                soundWin();
                document.getElementById('foodContainer').style.display = 'none';
                
                if (currentLevel < levels.length - 1) {
                    document.getElementById('next-btn').style.display = 'block';
                } else {
                    const animalDiv = document.getElementById('animal');
                    animalDiv.innerText = "🎉🦖🐱🐶🐵🎉"; 
                    animalDiv.style.transform = "scale(1.0)";
                    document.getElementById('finish-btn').style.display = 'block';
                }
            }
        }

        function goToNextLevel() {
            soundLevelUp();
            currentLevel++;
            loadLevel();
        }

        function finalCelebration() {
            document.getElementById('finish-btn').style.display = 'none';
            document.getElementById('win-text').style.display = 'block';
            document.getElementById('restart-btn').style.display = 'block';
            
            let count = 0;
            let interval = setInterval(() => {
                playTone(440 + Math.random() * 400, 'sine', 0.15);
                count++;
                if (count > 15) clearInterval(interval);
            }, 120);
        }

        function resetGame() {
            document.getElementById('restart-btn').style.display = 'none';
            document.getElementById('win-text').style.display = 'none';
            document.getElementById('game-screen').classList.remove('active');
            currentLevel = 0;
            document.getElementById('canvas-container').style.display = 'block';
            initPhysics();
        }
    </script>
</body>
