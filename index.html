<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Географічний Квест</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Roboto, sans-serif; background: #0b0c10; color: #fff; }

        /* ЕКРАН 1: Авторизація */
        #auth-screen {
            position: absolute; width: 100%; height: 100%; z-index: 10;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: radial-gradient(circle, #1f2833 0%, #0b0c10 100%);
        }
        .login-box { background: rgba(31, 40, 51, 0.8); padding: 40px; border-radius: 15px; border: 2px solid #45f3ff; text-align: center; box-shadow: 0 0 20px #45f3ff33; }
        .login-box h2 { margin-bottom: 20px; color: #45f3ff; font-size: 24px; letter-spacing: 1px; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 20px; border: none; border-radius: 5px; background: #0b0c10; color: #fff; font-size: 16px; border: 1px solid #66fcf1; text-align: center; }
        .login-box button { background: #66fcf1; color: #0b0c10; border: none; padding: 12px 30px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .login-box button:hover { background: #45f3ff; box-shadow: 0 0 15px #45f3ff; }

        /* ЕКРАН 2: Фізична сітка */
        #canvas-container { position: absolute; width: 100%; height: 100%; z-index: 5; display: none; }
        canvas { width: 100%; height: 100%; display: block; }
        .hint { position: absolute; top: 5%; left: 50%; transform: translateX(-50%); font-size: 20px; color: #45f3ff; text-shadow: 0 0 10px #45f3ff; pointer-events: none; text-align: center; font-weight: bold; }

        /* ЕКРАН 3: Головне меню */
        #menu-screen {
            position: absolute; width: 100%; height: 100%; z-index: 1;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: #0b0c10; opacity: 0; transition: opacity 1s ease;
        }
        #menu-screen.active { opacity: 1; z-index: 4; }
        .welcome-text { font-size: 28px; margin-bottom: 30px; color: #66fcf1; text-align: center; }
        .menu-grid { display: grid; grid-template-columns: repeat(2, 220px); gap: 20px; justify-content: center; }
        .menu-btn {
            background: transparent; border: 2px solid #66fcf1; color: #66fcf1;
            padding: 20px; font-size: 18px; font-weight: bold; border-radius: 10px;
            cursor: pointer; transition: all 0.3s ease; text-align: center;
        }
        .menu-btn:hover { background: #66fcf1; color: #0b0c10; box-shadow: 0 0 20px #66fcf1; transform: scale(1.05); }
        .menu-btn.full-width { grid-column: span 2; border-color: #45f3ff; color: #45f3ff; }
        .menu-btn.full-width:hover { background: #45f3ff; color: #0b0c10; box-shadow: 0 0 20px #45f3ff; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="login-box">
            <h2>ВХІД ДО ГЕО-ПРОСТОРУ</h2>
            <input type="text" id="username" placeholder="Введіть ваше ім'я..." autocomplete="off">
            <button onclick="startChallenge()">УВІЙТИ</button>
        </div>
    </div>

    <div id="canvas-container">
        <div class="hint">Свайпни або розріж сітку, щоб пройти далі!</div>
        <canvas id="clothCanvas"></canvas>
    </div>

    <div id="menu-screen">
        <div class="welcome-text" id="greeting">Вітаємо, Досліднику!</div>
        <div class="menu-grid">
            <button class="menu-btn" onclick="selectTopic('Біосфера')">Біосфера</button>
            <button class="menu-btn" onclick="selectTopic('Літосфера')">Літосфера</button>
            <button class="menu-btn" onclick="selectTopic('Гідросфера')">Гідросфера</button>
            <button class="menu-btn" onclick="selectTopic('Атмосфера')">Атмосфера</button>
            <button class="menu-btn menu-btn.full-width" onclick="selectTopic('Географічна оболонка')">Географічна оболонка</button>
        </div>
    </div>

    <script>
        let userName = "";

        // Логіка переходу після введення імені
        function startChallenge() {
            const input = document.getElementById('username').value.trim();
            if (input === "") {
                alert("Будь ласка, введіть своє ім'я!");
                return;
            }
            userName = input;
            document.getElementById('greeting').innerText = `Вітаємо, ${userName}! Оберіть оболонку для дослідження:`;
            
            // Ховаємо логін, показуємо сітку
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('canvas-container').style.display = 'block';
            initPhysics();
        }

        // Дія при виборі теми в меню
        function selectTopic(topic) {
            alert(`Переходимо до вивчення теми: ${topic}`);
            // Тут згодом можна додати редірект на сторінки тем: window.location.href = topic + ".html";
        }

        // --- ФІЗИКА СІТКИ (PHYSICS ENGINE) ---
        const canvas = document.getElementById('clothCanvas');
        const ctx = canvas.getContext('2d');
        
        let points = [], links = [];
        let mouse = { x: 0, y: 0, px: 0, py: 0, down: false };
        let cutCount = 0;
        let challengePassed = false;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        class Point {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.oldx = x; this.oldy = y;
                this.pinned = false;
            }
            update() {
                if (this.pinned) return;
                let vx = (this.x - this.oldx) * 0.98;
                let vy = (this.y - this.oldy) * 0.98;
                this.oldx = this.x; this.oldy = this.y;
                this.x += vx;
                this.y += vy + 0.15; // невелика гравітація
            }
        }

        class Link {
            constructor(p1, p2, len) {
                this.p1 = p1; this.p2 = p2; this.length = len;
                this.broken = false;
            }
            resolve() {
                if (this.broken) return;
                let dx = this.p2.x - this.p1.x;
                let dy = this.p2.y - this.p1.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                let diff = this.length - dist;
                let percent = (diff / dist) * 0.5;
                
                if (!this.p1.pinned) { this.p1.x -= dx * percent; this.p1.y -= dy * percent; }
                if (!this.p2.pinned) { this.p2.x += dx * percent; this.p2.y += dy * percent; }
            }
        }

        function initPhysics() {
            resizeCanvas();
            points = []; links = []; cutCount = 0; challengePassed = false;

            const spacing = 25; 
            const cols = Math.floor(canvas.width / spacing) - 4;
            const rows = 16;
            const startX = (canvas.width - cols * spacing) / 2;
            const startY = 100;

            // Створюємо точки
            for (let y = 0; y <= rows; y++) {
                for (let x = 0; x <= cols; x++) {
                    let p = new Point(startX + x * spacing, startY + y * spacing);
                    if (y === 0) p.pinned = true; // Закріплюємо верх
                    points.push(p);
                }
            }

            // Зв'язуємо точки в сітку
            for (let y = 0; y <= rows; y++) {
                for (let x = 0; x <= cols; x++) {
                    if (x < cols) links.push(new Link(points[y * (cols + 1) + x], points[y * (cols + 1) + x + 1], spacing));
                    if (y < rows) links.push(new Link(points[y * (cols + 1) + x], points[(y + 1) * (cols + 1) + x], spacing));
                }
            }
            animate();
        }

        // Перевірка перетину двох ліній (для розрізання)
        function checkIntersection(p1, p2, p3, p4) {
            let det = (p2.x - p1.x) * (p4.y - p3.y) - (p4.x - p3.x) * (p2.y - p1.y);
            if (det === 0) return false;
            let lambda = ((p4.y - p3.y) * (p4.x - p1.x) + (p3.x - p4.x) * (p4.y - p1.y)) / det;
            let gamma = ((p1.y - p2.y) * (p4.x - p1.x) + (p2.x - p1.x) * (p4.y - p1.y)) / det;
            return (0 < lambda && lambda < 1) && (0 < gamma && gamma < 1);
        }

        function animate() {
            if (challengePassed) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Оновлення точок
            points.forEach(p => p.update());

            // Оновлення зв'язків та перевірка на розрізання
            for (let i = 0; i < 5; i++) {
                links.forEach(l => {
                    if (!l.broken) {
                        l.resolve();
                        if (mouse.down && checkIntersection(l.p1, l.p2, {x: mouse.px, y: mouse.py}, {x: mouse.x, y: mouse.y})) {
                            l.broken = true;
                            cutCount++;
                        }
                    }
                });
            }

            // Малювання сітки неоновим фіолетовим/синім кольором
            ctx.beginPath();
            ctx.strokeStyle = '#8a2be2';
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#8a2be2';
            ctx.lineWidth = 1.5;
            links.forEach(l => {
                if (!l.broken) {
                    ctx.moveTo(l.p1.x, l.p1.y);
                    ctx.lineTo(l.p2.x, l.p2.y);
                }
            });
            ctx.stroke();
            ctx.shadowBlur = 0; // скидання тіні для швидкодії

            // Збереження попередніх координат миші
            mouse.px = mouse.x;
            mouse.py = mouse.y;

            // Умова проходження: якщо зроблено достатньо розрізів (сітка порвана)
            if (cutCount > 80) {
                challengePassed = true;
                setTimeout(showMenu, 400);
            } else {
                requestAnimationFrame(animate);
            }
        }

        function showMenu() {
            document.getElementById('canvas-container').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('canvas-container').style.display = 'none';
                const menu = document.getElementById('menu-screen');
                menu.classList.add('active');
            }, 500);
        }

        // Події миші та тачскріну
        function handleMove(e) {
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            mouse.x = clientX;
            mouse.y = clientY;
        }

        window.addEventListener('mousedown', (e) => { mouse.down = true; handleMove(e); mouse.px = mouse.x; mouse.py = mouse.y; });
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', () => mouse.down = false);

        window.addEventListener('touchstart', (e) => { mouse.down = true; handleMove(e); mouse.px = mouse.x; mouse.py = mouse.y; });
        window.addEventListener('touchmove', handleMove);
        window.addEventListener('touchend', () => mouse.down = false);
    </script>
</body>
</html>
