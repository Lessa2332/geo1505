<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ням-Ням Квест для Малюка</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #1a1a2e; color: #fff; }

        /* ЕКРАН 1: Фізична сітка-сюрприз */
        #canvas-container { position: absolute; width: 100%; height: 100%; z-index: 5; background: #111; }
        canvas { width: 100%; height: 100%; display: block; }
        .hint { position: absolute; top: 8%; left: 50%; transform: translateX(-50%); font-size: 26px; color: #ff007f; text-shadow: 0 0 10px #ff007f; pointer-events: none; text-align: center; font-weight: bold; width: 90%; }

        /* ЕКРАН 2: Головна гра (Погодуй мене) */
        #game-screen {
            position: absolute; width: 100%; height: 100%; z-index: 1;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            background: radial-gradient(circle, #222831 0%, #1a1a2e 100%);
            padding: 20px; opacity: 0; transition: opacity 0.8s ease;
        }
        #game-screen.active { opacity: 1; z-index: 4; }

        /* Великий Динозаврик по центру */
        .character-zone {
            flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; position: relative;
        }
        #dino { font-size: 150px; transition: transform 0.2s ease, filter 0.3s; cursor: pointer; display: inline-block; }
        #dino.eating { transform: scale(1.3) rotate(5deg); }
        #dino.happy { animation: dance 0.5s ease infinite alternate; }

        /* Зона ротика, куди треба кидати їжу (невидима ціль) */
        .target-mouth {
            position: absolute; width: 120px; height: 120px; top: 55%; left: 50%; transform: translate(-50%, -50%); border-radius: 50%;
        }

        /* Нижня панель з їжею */
        .food-bar {
            width: 100%; max-width: 500px; display: flex; justify-content: space-around; align-items: center; background: rgba(255, 255, 255, 0.1); padding: 20px; border-radius: 25px; border: 3px dashed #45f3ff; margin-bottom: 20px; min-height: 110px;
        }

        /* Елементи їжі для перетягування */
        .food-item {
            font-size: 65px; cursor: grab; touch-action: none; display: inline-block; transition: transform 0.1s; z-index: 10;
        }
        .food-item:active { cursor: grabbing; transform: scale(1.2); }

        @keyframes dance {
            0% { transform: scale(1.1) translateY(0) rotate(-5deg); }
            100% { transform: scale(1.1) translateY(-15px) rotate(5deg); }
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <div class="hint">Пальчиком рви сітку! 🦖✨</div>
        <canvas id="clothCanvas"></canvas>
    </div>

    <div id="game-screen">
        <div class="character-zone">
            <div id="dino">🦖</div>
            <div class="target-mouth" id="mouthTarget"></div>
        </div>

        <div class="food-bar" id="foodContainer">
            <div class="food-item" id="food1" data-emoji="🌿">🌿</div>
            <div class="food-item" id="food2" data-emoji="🥩">🥩</div>
            <div class="food-item" id="food3" data-emoji="🍉">🍉</div>
        </div>
    </div>

    <script>
        // --- СИНТЕЗАТОР СИСТЕМНИХ ЗВУКІВ (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTone(freq, type, duration) {
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        // Звуки для різних подій
        const soundSlice = () => playTone(600, 'sine', 0.05); // Дзинь при різанні
        const soundDrag = () => playTone(300, 'triangle', 0.08); // Вжух при дотику до їжі
        const soundYum = () => { // Ням-ням звук (подвійний тон)
            playTone(400, 'square', 0.1);
            setTimeout(() => playTone(500, 'square', 0.15), 100);
        };

        // --- ФІЗИКА СІТКИ ---
        const canvas = document.getElementById('clothCanvas');
        const ctx = canvas.getContext('2d');
        let points = [], links = [], mouse = { x:0, y:0, px:0, py:0, down:false }, cutCount = 0, passed = false;

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);

        class Point {
            constructor(x, y) { this.x = x; this.y = y; this.oldx = x; this.oldy = y; this.pinned = false; }
            update() {
                if (this.pinned) return;
                let vx = (this.x - this.oldx) * 0.98, vy = (this.y - this.oldy) * 0.98;
                this.oldx = this.x; this.oldy = this.y;
                this.x += vx; this.y += vy + 0.15;
            }
        }

        class Link {
            constructor(p1, p2, len) { this.p1 = p1; this.p2 = p2; this.length = len; this.broken = false; }
            resolve() {
                if (this.broken) return;
                let dx = this.p2.x - this.p1.x, dy = this.p2.y - this.p1.y, dist = Math.sqrt(dx*dx + dy*dy), diff = this.length - dist, percent = (diff / dist) * 0.5;
                if (!this.p1.pinned) { this.p1.x -= dx * percent; this.p1.y -= dy * percent; }
                if (!this.p2.pinned) { this.p2.x += dx * percent; this.p2.y += dy * percent; }
            }
        }

        function initPhysics() {
            resizeCanvas();
            const spacing = 30; // трохи більша сітка, щоб легше рвалася
            const cols = Math.floor(canvas.width / spacing) - 2;
            const rows = 14;
            const startX = (canvas.width - cols * spacing) / 2, startY = 80;

            for (let y = 0; y <= rows; y++) {
                for (let x = 0; x <= cols; x++) {
                    let p = new Point(startX + x * spacing, startY + y * spacing);
                    if (y === 0) p.pinned = true;
                    points.push(p);
                }
            }
            for (let y = 0; y <= rows; y++) {
                for (let x = 0; x <= cols; x++) {
                    if (x < cols) links.push(new Link(points[y * (cols + 1) + x], points[y * (cols + 1) + x + 1], spacing));
                    if (y < rows) links.push(new Link(points[y * (cols + 1) + x], points[(y + 1) * (cols + 1) + x], spacing));
                }
            }
            animate();
        }

        function checkIntersection(p1, p2, p3, p4) {
            let det = (p2.x - p1.x) * (p4.y - p3.y) - (p4.x - p3.x) * (p2.y - p1.y);
            if (det === 0) return false;
            let lambda = ((p4.y - p3.y) * (p4.x - p1.x) + (p3.x - p4.x) * (p4.y - p1.y)) / det;
            let gamma = ((p1.y - p2.y) * (p4.x - p1.x) + (p2.x - p1.x) * (p4.y - p1.y)) / det;
            return (0 < lambda && lambda < 1) && (0 < gamma && gamma < 1);
        }

        function animate() {
            if (passed) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            points.forEach(p => p.update());

            let slashed = false;
            for (let i = 0; i < 5; i++) {
                links.forEach(l => {
                    if (!l.broken) {
                        l.resolve();
                        if (mouse.down && checkIntersection(l.p1, l.p2, {x: mouse.px, y: mouse.py}, {x: mouse.x, y: mouse.y})) {
                            l.broken = true;
                            cutCount++;
                            slashed = true;
                        }
                    }
                });
            }
            if (slashed) soundSlice();

            ctx.beginPath();
            ctx.strokeStyle = '#ff007f';
            ctx.lineWidth = 3; // Товсті лінії, красивіші для малюка
            links.forEach(l => { if (!l.broken) { ctx.moveTo(l.p1.x, l.p1.y); ctx.lineTo(l.p2.x, l.p2.y); } });
            ctx.stroke();

            mouse.px = mouse.x; mouse.py = mouse.y;

            if (cutCount > 50) { // Менше ліній треба порвати, щоб дитина не втомилася
                passed = true;
                setTimeout(showGame, 300);
            } else {
                requestAnimationFrame(animate);
            }
        }

        function showGame() {
            document.getElementById('canvas-container').style.display = 'none';
            document.getElementById('game-screen').classList.add('active');
            initDragAndDrop();
        }

        function handleMove(e) {
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            mouse.x = clientX; mouse.y = clientY;
        }
        window.addEventListener('mousedown', (e) => { audioCtx.resume(); mouse.down = true; handleMove(e); mouse.px = mouse.x; mouse.py = mouse.y; });
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', () => mouse.down = false);
        window.addEventListener('touchstart', (e) => { audioCtx.resume(); mouse.down = true; handleMove(e); mouse.px = mouse.x; mouse.py = mouse.y; });
        window.addEventListener('touchmove', handleMove);
        window.addEventListener('touchend', () => mouse.down = false);

        initPhysics();

        // --- МЕХАНІКА ПЕРЕТЯГУВАННЯ ЇЖІ (DRAG AND DROP) ---
        function initDragAndDrop() {
            const foodItems = document.querySelectorAll('.food-item');
            const dino = document.getElementById('dino');
            const mouthTarget = document.getElementById('mouthTarget');

            foodItems.forEach(item => {
                let startX = 0, startY = 0;
                let currentX = 0, currentY = 0;

                item.addEventListener('touchstart', dragStart);
                item.addEventListener('mousedown', dragStart);

                function dragStart(e) {
                    soundDrag();
                    let clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    let clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    
                    startX = clientX - currentX;
                    startY = clientY - currentY;

                    document.addEventListener('touchmove', dragMove, { passive: false });
                    document.addEventListener('mousemove', dragMove);
                    document.addEventListener('touchend', dragEnd);
                    document.addEventListener('mouseup', dragEnd);
                }

                function dragMove(e) {
                    e.preventDefault(); // Забороняємо скрол екрану під час гри
                    let clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    let clientY = e.touches ? e.touches[0].clientY : e.clientY;

                    currentX = clientX - startX;
                    currentY = clientY - startY;

                    item.style.transform = `translate(${currentX}px, ${currentY}px) scale(1.2)`;
                }

                function dragEnd() {
                    document.removeEventListener('touchmove', dragMove);
                    document.removeEventListener('mousemove', dragMove);
                    document.removeEventListener('touchend', dragEnd);
                    document.removeEventListener('mouseup', dragEnd);

                    // Перевіряємо, чи потрапила їжа в ротик динозавру
                    const itemRect = item.getBoundingClientRect();
                    const mouthRect = mouthTarget.getBoundingClientRect();

                    // Перетин центрів елементів
                    const isFed = !(itemRect.right < mouthRect.left || 
                                    itemRect.left > mouthRect.right || 
                                    itemRect.bottom < mouthRect.top || 
                                    itemRect.top > mouthRect.bottom);

                    if (isFed) {
                        soundYum();
                        dino.innerText = "😋";
                        dino.classList.add('eating');
                        item.style.display = 'none'; // Їжа з'їдена!

                        setTimeout(() => {
                            dino.innerText = "🦖";
                            dino.classList.remove('eating');
                            checkIfAllEaten();
                        }, 800);
                    } else {
                        // Якщо промазав — їжа повертається на місце
                        currentX = 0;
                        currentY = 0;
                        item.style.transform = `translate(0px, 0px)`;
                    }
                }
            });
        }

        // Перевірка, чи з'їли всю їжу
        function checkIfAllEaten() {
            const visibleFood = Array.from(document.querySelectorAll('.food-item')).filter(i => i.style.display !== 'none');
            if (visibleFood.length === 0) {
                const dino = document.getElementById('dino');
                dino.innerText = "👑🦖🎉"; // Перемога!
                dino.classList.add('happy');
                document.querySelector('.character-zone').insertAdjacentHTML('beforeend', '<div style="font-size:30px; margin-top:20px; color:#66fcf1; font-weight:bold;">ДЯКУЮ! ТИ СУПЕР!</div>');
                
                // Салют звуків
                setTimeout(() => playTone(523.25, 'sine', 0.2), 100); // До
                setTimeout(() => playTone(659.25, 'sine', 0.2), 250); // Мі
                setTimeout(() => playTone(783.99, 'sine', 0.2), 400); // Соль
                setTimeout(() => playTone(1046.50, 'sine', 0.4), 550); // До мажор вищий
            }
        }
    </script>
</body>
</html>
